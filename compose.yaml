name: defencelens
x-backend: &backend
  build: ./backend
  environment: &environment
    DATABASE_URL: postgresql+psycopg://lens:${POSTGRES_PASSWORD:-lens-local}@db:5432/lens
    REDIS_URL: redis://redis:6379/0
    API_TOKEN: ${API_TOKEN:-local-development-token}
    DATA_DIR: /data
  volumes:
    - scan-data:/data
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
services:
  db:
    image: postgres:16.8-alpine
    environment:
      POSTGRES_DB: lens
      POSTGRES_USER: lens
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lens-local}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lens"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
  redis:
    image: redis:7.4.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
  api:
    <<: *backend
    ports:
      - "127.0.0.1:18000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
  worker:
    <<: *backend
    command: ["sh", "-c", "rq worker scans --url $$REDIS_URL --with-scheduler"]
    mem_limit: 2g
    cpus: 2
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    depends_on:
      api:
        condition: service_healthy
  dispatcher:
    <<: *backend
    command: ["python", "-m", "app.dispatcher"]
    depends_on:
      api:
        condition: service_healthy
  web:
    build: ./frontend
    ports:
      - "127.0.0.1:18080:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
  vector:
    image: timberio/vector:0.46.1-debian
    environment:
      API_TOKEN: ${API_TOKEN:-local-development-token}
      VECTOR_SOURCE_ID: ${VECTOR_SOURCE_ID:-vector-demo}
    volumes:
      - ./vector/vector.yaml:/etc/vector/vector.yaml:ro
      - ./demo/logs:/logs:ro
      - vector-data:/var/lib/vector
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres-data:
  redis-data:
  scan-data:
  vector-data:
